<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0e1a"/>
  
  <!-- Blue orb - bottom left, with glow -->
  <circle cx="18" cy="46" r="18" fill="#1e3a8a" opacity="0.5" filter="url(#blur)"/>
  <circle cx="18" cy="46" r="10" fill="#1e3a8a" opacity="0.7"/>
  
  <!-- Gold orb - top right, with glow -->
  <circle cx="46" cy="20" r="16" fill="#b88a4a" opacity="0.4" filter="url(#blur)"/>
  <circle cx="46" cy="20" r="9" fill="#b88a4a"/>
  
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>
</svg>
